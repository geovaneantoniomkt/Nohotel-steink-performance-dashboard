name: Atualizar dashboard

# Roda 3x por dia (06:17, 12:17 e 18:17 em Brasília), manualmente, ou quando o código do dashboard muda.
# Os minutos fogem da hora cheia de propósito: é quando o agendador do GitHub mais atrasa ou pula execuções.
on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "netlify/**"
      - "functions/**"
      - "scripts/**"
      - "netlify.toml"
      - "wrangler.toml"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Expostos como env para poder testar nos `if` dos passos (o contexto secrets não vale ali).
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'nohotel-dashboard' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Coletar dados do Meta (Ads + orgânico)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ADS_TOKEN || secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID || '812845936220210' }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID || '207987622557413' }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID || '17841402216050279' }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v23.0' }}
          META_SINCE: ${{ vars.META_SINCE || '2025-04-01' }}
          OUT_DIR: public/data
        run: python scripts/fetch_meta.py

      - name: Baixar imagens do Meta
        # Os links do fbcdn expiram e nem sempre abrem fora do Facebook; as imagens passam a sair do próprio site.
        continue-on-error: true
        env:
          OUT_DIR: public/data
        run: python scripts/cache_images.py

      - name: Coletar dados do Google Ads
        # Sem credenciais o script gera google.json com "configured: false" e o dashboard mostra o passo a passo.
        continue-on-error: true
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_CUSTOMER_ID || '781-346-4105' }}
          GOOGLE_ADS_API_VERSION: ${{ vars.GOOGLE_ADS_API_VERSION || '' }}
          GOOGLE_SINCE: ${{ vars.GOOGLE_SINCE || '2025-04-01' }}
          OUT_DIR: public/data
        run: python scripts/fetch_google.py

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Testar a camada de senha
        # Se a proteção quebrar, o deploy não sai — melhor ficar com os dados de ontem
        # do que publicar o dashboard aberto.
        run: node tests/auth.test.mjs

      # ---------------------------------------------------------------- deploy
      # Publica em TODO destino configurado. Antes, o Cloudflare só rodava sem o Netlify
      # e o Netlify ficava parado no último deploy manual; agora os dois endereços andam juntos.

      - name: Publicar no Cloudflare Pages
        id: cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx --yes wrangler@4.131.1 pages deploy public \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true
          echo "url=https://$CF_PAGES_PROJECT.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Conferir o Cloudflare (continua atrás de senha)
        if: ${{ steps.cloudflare.outputs.url != '' }}
        run: bash scripts/check_live.sh "${{ steps.cloudflare.outputs.url }}" "variáveis do projeto no Cloudflare Pages (Settings → Variables and Secrets, ambiente Production)"

      - name: Publicar no Netlify
        id: netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: |
          out=$(npx --yes netlify-cli@23 deploy \
            --prod \
            --dir public \
            --site "$NETLIFY_SITE_ID" \
            --message "Atualização automática ${{ github.run_number }}" \
            --json)
          echo "$out"
          url=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d.get('url') or d.get('deploy_url') or '')" "$out")
          echo "Publicado em: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Conferir o Netlify (continua atrás de senha)
        if: ${{ steps.netlify.outputs.url != '' }}
        run: bash scripts/check_live.sh "${{ steps.netlify.outputs.url }}" "variáveis de ambiente do Netlify (Site configuration → Environment variables)"

      - name: Nenhum destino configurado
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::Nenhum destino de deploy configurado."
          echo "Cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (ou NETLIFY_AUTH_TOKEN e NETLIFY_SITE_ID) nos secrets."
          exit 1

      - name: Resumo
        if: always()
        run: |
          echo "### Dashboard Nohotel" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "- Cloudflare Pages: https://$CF_PAGES_PROJECT.pages.dev (${{ steps.cloudflare.outcome }})" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "- Netlify: ${{ steps.netlify.outputs.url || 'deploy não concluído' }} (${{ steps.netlify.outcome }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Netlify: não configurado (NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID ausentes) — o endereço .netlify.app NÃO é atualizado" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f public/data/meta.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          m = json.load(open("public/data/meta.json", encoding="utf-8"))
          r = m.get("range") or {}
          print(f"- Meta gerado em: {m.get('generated_at')} · dados até {r.get('until')}")
          print(f"- Campanhas: {len(m.get('campaigns', []))} · Anúncios: {len(m.get('ads', []))} · Linhas diárias: {len(m.get('daily', []))}")
          img = "public/data/img"
          if os.path.isdir(img):
              print(f"- Imagens publicadas no site: {len(os.listdir(img))}")
          for w in m.get("warnings", []):
              print(f"- ⚠️ Meta: {w}")
          PY
          else
            echo "- Coleta do Meta falhou (meta.json não gerado)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f public/data/google.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          g = json.load(open("public/data/google.json", encoding="utf-8"))
          if g.get("configured"):
              print(f"- Google Ads gerado em: {g.get('generated_at')} · API {g.get('api_version')} · campanhas: {len(g.get('campaigns', []))} · linhas diárias: {len(g.get('daily', []))}")
          else:
              print(f"- Google Ads não configurado: {g.get('reason')}")
          for w in g.get("warnings", []):
              print(f"- ⚠️ Google: {w}")
          PY
          fi
